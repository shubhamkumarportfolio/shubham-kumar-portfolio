<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/fonts/Geist-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/GeistMono-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Shubham Kumar is a Brand & Marketing Visual Designer turning complex products and business ideas into clear visual communication."
    />
    <meta name="theme-color" content="#FFFFFF" />
    <script>
      ;(() => {
        const storageKey = 'shubham-portfolio-theme'
        let theme = 'light'

        try {
          if (localStorage.getItem(storageKey) === 'dark') theme = 'dark'
        } catch {
          theme = 'light'
        }

        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'dark' ? '#0B0D12' : '#FFFFFF'
      })()
    </script>
    <title>Shubham Kumar — Brand & Marketing Visual Designer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
